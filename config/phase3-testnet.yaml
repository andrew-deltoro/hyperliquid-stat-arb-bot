# Phase 3 scheduler configuration

# Pairs to monitor. Each entry is [coin_a, coin_b].
# Sourced from reports/scan_*.csv top scorers.

pairs:
  - ["ETH", "BTC"]
  - ["SOL", "AVAX"]
  - ["AAVE", "COMP"]

data:
  interval: "1h"
  lookback_hours: 720      # 30 days

model:
  coint_draws: 2000
  coint_tune: 2000
  ou_draws: 2000
  ou_tune: 2000
  chains: 4
  cores: 4

# Entry thresholds
signal:
  z_entry_min: 1.5         # |z| must exceed this to fire a signal
  edge_min: 0.05           # P(revert) - 0.5 must exceed this
  max_btc_vol: 0.55    # skip entries above this annualized BTC vol

# Position construction & exit
position:
  base_notional: 2700.0
  baseline_balance: 5000.0
  compounding_enabled: true
  scale_safeguards: true
  target_frac: 0.5
  exit_horizon_mult: 2.0
  stop_mult: 3.0
  beta_shift_max: 0.20

risk:
  max_concurrent_positions: 3
  max_total_notional: 50.0
  cluster_caps:
    btc_eth: 25.0
    alt_l1: 30.0
    defi: 30.0
    oracle: 20.0
    meme: 15.0


# Population prior on kappa (from multilevel OU fit, see test_multilevel_ou.py)
ou_prior:
  kappa_pop: 0.0115
  kappa_pop_sd: 0.0040

# Executor mode: "dry_run" logs what would happen; "live" places real orders
executor:
  mode: "live"
  private_key_env: "HL_PRIVATE_KEY"
  account_address_env: "HL_ACCOUNT_ADDRESS"
  network: "testnet"
  slippage_tolerance: 0.03
  prefer_maker: true
  maker_timeout_sec: 30


#safeguards
safeguards:
  max_notational_per_order: 25.0
  max_total_exposure_usd: 50.0
  max_daily_orders: 10
