# LOCKED 2026-10-10 before v2 collection.
# Separate from v1: v1 remains unchanged as the control.

hypothesis_id: hl-perp-oracle-cost-gated-4h-v2
mode: paper
api_url: https://api.hyperliquid.xyz/info

universe:
  minimum_day_volume_usd: 5000000.0
  require_open_interest: true
  minimum_assets: 20

signal:
  field: impact_mid_minus_oracle
  richest_fraction: 0.10
  cheapest_fraction: 0.10
  require_signal_side: true
  # Tier-0 entry + exit fees are 9 bps. The additional 3 bps is a
  # pre-registered spread/model-error buffer, not fitted from outcomes.
  minimum_executable_edge_bps: 12.0

entry:
  evaluate_every_hours: 1
  grace_minutes: 10
  notional_usd_per_position: 500.0

exit:
  hold_hours: 4

execution_model:
  order_type: market
  require_full_visible_book_fill: true
  perp_taker_fee_rate: 0.00045

inference:
  unit: nonoverlapping_four_hour_cohort
  confirmatory_entry_hours_utc: [0, 4, 8, 12, 16, 20]
  minimum_complete_cohorts: 30
  locked_sample: first_30_complete_confirmatory_cohorts
  support_if_probability_mean_gt_zero_at_least: 0.95
  posterior_draws: 50000
  seed: 20261010
  prior:
    family: normal_inverse_gamma
    mean_usd: 0.0
    kappa: 0.25
    alpha: 2.0
    beta: 16.0

measurement:
  collector_interval_seconds: 300
  path_interval_minutes: 15

outputs:
  database: state/oracle_convergence_cost_gated_v2.db
  report: state/oracle_convergence_cost_gated_v2_report.json
  dashboard: reports/oracle_convergence_cost_gated_v2_dashboard.png
