# Phase 3 LIVE config — mainnet execution with tiny safeguards
# Scale by editing the safeguards block only.

pairs:
  - ["LINK", "PYTH"]
  - ["UNI", "SUSHI"]
  - ["ETH", "BTC"]
  - ["SOL", "AVAX"]
  - ["AAVE", "COMP"]

data:
  interval: "1h"
  lookback_hours: 720

model:
  coint_draws: 500
  coint_tune: 500
  ou_draws: 500
  ou_tune: 500
  chains: 4

signal:
  z_entry_min: 1.5
  edge_min: 0.05

position:
  base_notional: 2700.0            # produces ~$200 positions → ~$100 per leg
  target_frac: 0.5
  exit_horizon_mult: 2.0
  stop_mult: 3.0
  beta_shift_max: 0.20

risk:
  max_concurrent_positions: 3
  max_total_notional: 500.0        # 10% of $5k account

executor:
  mode: "live"
  private_key_env: "HL_PRIVATE_KEY_MAINNET"
  account_address_env: "HL_ACCOUNT_ADDRESS_MAINNET"
  network: "mainnet"
  slippage_tolerance: 0.01          # 1% tighter than testnet
  prefer_maker: true              # try post-only limit first
  maker_timeout_sec: 30           # wait this long before falling back to market


safeguards:
  max_notional_per_order: 100.0    # $100 per leg hard cap
  max_total_exposure_usd: 500.0    # ~2-3 concurrent positions
  max_daily_orders: 10

fees:
  taker_fee_pct: 0.00045
  maker_fee_pct: 0.00015
  default_fee_pct: 0.00045
  slippage_bps: 3

ou_prior:
  kappa_pop: 0.0115
  kappa_pop_sd: 0.0040
