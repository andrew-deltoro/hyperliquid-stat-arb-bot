pairs:
- - SOL
  - AVAX
- - AAVE
  - COMP
- - SNX
  - DYDX
- - xyz:GOLD
  - xyz:SILVER
- - xyz:NVDA
  - xyz:PLTR
- - AIXBT
  - DOGE
- - xyz:MU
  - xyz:TSM
- - xyz:AMD
  - xyz:TSM
- - MEME
  - TIA
- - SNX
  - TIA
- - ORDI
  - SOL
- - SNX
  - SUI
- - GMT
  - MEME
- - ETC
  - NEO
- - LTC
  - DOGE
- - ETH
  - SOL
data:
  interval: 1h
  lookback_hours: 720
model:
  # Joint error-correction: one NUTS fit for (α, β, κ, σ, ν). Replaces the
  # two-step cointegration + OU when joint_ecm is true (audit H6).
  joint_ecm: true
  coint_draws: 2000
  coint_tune: 2000
  ou_draws: 2000
  ou_tune: 2000
  ecm_draws: 2000
  ecm_tune: 2000
  chains: 4
  cores: 4
signal:
  z_entry_min: 1.0
  half_life_max_hours: 96
  half_life_overrides:
    xyz:MU/xyz:TSM: 200
    xyz:AMD/xyz:TSM: 200
    xyz:NVDA/xyz:PLTR: 200
    xyz:GOLD/xyz:SILVER: 150
  edge_min: 0.05
  max_btc_vol: 0.55
  z_entry_min_wide: 1.2
  z_entry_min_tight: 0.9
  kalman_enabled: true
  kalman_q: 1.0e-05
  kalman_r: 0.0001
  kalman_alpha_max_sd: 3.0
  # Engle-Granger residual test at this level (0.01 / 0.05 / 0.10); null disables.
  stationarity_level: 0.10
  # Joint-ECM: require P(κ > kappa_floor) ≥ min_p_kappa (rejects random walks).
  kappa_floor: 0.002
  min_p_kappa: 0.80
  # Minimum posterior-predictive E[net trade return] per unit notional.
  min_expected_return: 0.0
position:
  # base_notional / baseline_balance / compounding only apply when
  # leverage.mode is not "kelly".
  base_notional: 2500.0
  baseline_balance: 1035.0
  compounding_enabled: true
  scale_safeguards: false
  dry_run_balance: 3100.0
  target_frac: 0.75
  use_trailing_stop: true
  exit_mode: cross
  cross_exit_frac: 0.75
  trail_frac: 0.25
  trail_activation_frac: 0.5
  exit_horizon_mult: 3.33
  stop_mult: 3.0
  beta_shift_max: 0.2
risk:
  max_concurrent_positions: 10
  # Gross leg notional (|leg A| + |leg B|) across open pairs.
  max_total_notional: 4650.0
  # Gross leg notional per cluster; each leg counts toward its own coin's cluster.
  cluster_caps:
    btc_eth: 1200.0
    alt_l1: 1200.0
    defi: 1000.0
    oracle: 600.0
    meme: 800.0
    xyz_semis: 900.0
    xyz_metals: 700.0
  max_coin_gross_usd: 700.0
# Position sizing and leverage (src/hyperliquid_bot/phase3/leverage.py).
# N = equity * min(kelly_fraction * f* / (1 + (K-1) rho), max_trade_notional_frac),
# then capped by max_gross_leverage and a joint stress test per dex.
leverage:
  mode: kelly
  kelly_fraction: 0.25
  assumed_pair_correlation: 0.3
  max_trade_notional_frac: 0.15
  max_gross_leverage: 1.5
  stress_quantile: 0.01
  stress_margin_buffer: 1.5
  default_stress_loss_frac: 0.05
  default_max_leverage: 3
  exchange_leverage: 3
  isolated_leverage: 2
  cycle_hours: 4
  # Assumed net funding carry on gross notional; refine from funding history.
  funding_bps_per_hour: 0.1
  calibration_prior_mean: 0.5
  calibration_prior_sd: 0.25
  min_leg_usd: 11.0
  dry_run_dex_split:
    '': 0.8
    xyz: 0.2
executor:
  mode: live
  private_key_env: HL_PRIVATE_KEY_MAINNET
  account_address_env: HL_ACCOUNT_ADDRESS_MAINNET
  network: mainnet
  slippage_tolerance: 0.01
  prefer_maker: true
  maker_timeout_sec: 30
# Fixed account limits, independent of sizing. Review by hand when equity
# changes; they are not scaled automatically.
safeguards:
  max_notional_per_order: 500.0
  max_total_exposure_usd: 4650.0
  # Opening orders only; reduce-only closes don't count.
  max_daily_orders: 10
fees:
  taker_fee_pct: 0.00045
  maker_fee_pct: 0.00015
  default_fee_pct: 0.00045
  slippage_bps: 3
ou_prior:
  kappa_pop: 0.0115
  kappa_pop_sd: 0.004
