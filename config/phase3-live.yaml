pairs:
- - SOL
  - AVAX
- - AAVE
  - COMP
- - SNX
  - DYDX
- - xyz:GOLD
  - xyz:SILVER
- - xyz:NVDA
  - xyz:PLTR
- - AIXBT
  - DOGE
- - xyz:MU
  - xyz:TSM
- - xyz:AMD
  - xyz:TSM
- - MEME
  - TIA
- - SNX
  - TIA
- - ORDI
  - SOL
- - SNX
  - SUI
- - GMT
  - MEME
- - ETC
  - NEO
- - LTC
  - DOGE
- - ETH
  - SOL
- - LINEA
  - UMA
- - RSR
  - TAO
- - AIXBT
  - LAYER
data:
  interval: 1h
  lookback_hours: 720
model:
  # Joint error-correction: one NUTS fit for (α, β, κ, σ, ν). Replaces the
  # two-step cointegration + OU when joint_ecm is true (audit H6).
  joint_ecm: true
  coint_draws: 2000
  coint_tune: 2000
  ou_draws: 2000
  ou_tune: 2000
  ecm_draws: 2000
  ecm_tune: 2000
  chains: 4
  cores: 4
signal:
  z_entry_min: 1.0
  half_life_max_hours: 96
  half_life_overrides:
    xyz:MU/xyz:TSM: 200
    xyz:AMD/xyz:TSM: 200
    xyz:NVDA/xyz:PLTR: 200
    xyz:GOLD/xyz:SILVER: 150
  edge_min: 0.05
  max_btc_vol: 0.55
  z_entry_min_wide: 1.2
  z_entry_min_tight: 0.9
  kalman_enabled: true
  kalman_q: 1.0e-05
  kalman_r: 0.0001
  kalman_alpha_max_sd: 3.0
  # Engle-Granger residual test at this level (0.01 / 0.05 / 0.10); null disables.
  stationarity_level: 0.10
  # Joint-ECM: require P(κ > kappa_floor) ≥ min_p_kappa (rejects random walks).
  kappa_floor: 0.002
  min_p_kappa: 0.80
  # Minimum posterior-predictive E[net trade return] per unit notional.
  min_expected_return: 0.0
  # Single-leg shock detector (shock.py). Observability first.
  # Empirically a 1h >=5% / vol-z>=3 shock is NOT an edge in either direction
  # net of costs (momentum_event_study.py, 180d, 225 events), and the change-z
  # reversion rule failed walk-forward. So block is OFF: annotate and journal
  # shocks, then decide from our own book. Set block: true later to skip pair
  # entries for block_hours after a leg shock.
  shock_guard:
    block: false
    move_min: 0.05
    vol_z_min: 3.0
    vol_window: 168
    block_hours: 6
position:
  # base_notional / baseline_balance / compounding only apply when
  # leverage.mode is not "kelly".
  base_notional: 2500.0
  baseline_balance: 1035.0
  compounding_enabled: true
  scale_safeguards: false
  dry_run_balance: 3100.0
  # target_frac is REQUIRED: positions.py reads it with bracket access at entry
  # to bake target_spread. With exit_mode: cross that level is never evaluated,
  # but the value must exist for the entry path to run.
  target_frac: 0.75
  # exit_mode is the one switch that selects the exit rule. "cross" makes
  # use_trailing_stop / trail_frac / trail_activation_frac unreachable, so those
  # keys are deliberately absent. Re-add them only together with exit_mode.
  exit_mode: cross
  cross_exit_frac: 0.75
  # NB: cross_exit_frac is inert at the 4h cadence -- 0.50/0.75/1.00/1.50 are
  # bit-identical (see scripts/experiments/tape_exit_replay.py --sweep).
  exit_horizon_mult: 3.33
  stop_mult: 3.0
  # Beta-drift trigger: |Δβ| / posterior sd(β). Only a trigger; the exit also
  # requires a non-positive posterior predictive net PnL on the spread.
  beta_shift_min_posterior_sd: 2.0
risk:
  max_concurrent_positions: 10
  # Gross leg notional (|leg A| + |leg B|) across open pairs.
  max_total_notional: 4650.0
  # Gross leg notional per cluster; each leg counts toward its own coin's cluster.
  cluster_caps:
    btc_eth: 1200.0
    alt_l1: 1200.0
    defi: 1000.0
    oracle: 600.0
    meme: 800.0
    l2: 600.0
    ai: 600.0
    xyz_semis: 900.0
    xyz_metals: 700.0
  max_coin_gross_usd: 700.0
# Entry-only quarantines. Existing positions continue through normal risk exits.
entry_exclusions:
  manual_assets:
    NEO:
      until_utc: "2026-10-17T20:00:00+00:00"
      reason: "operator-requested seven-day review after repeated observed drag"
  performance:
    enabled: true
    lookback_days: 30
    minimum_closed_legs: 3
    consecutive_losing_legs: 3
    cooldown_hours: 168
  pair_health:
    enabled: true
    blocked_statuses: [red]
    maximum_age_hours: 192
# Position sizing and leverage (src/hyperliquid_bot/phase3/leverage.py).
# N = equity * min(kelly_fraction * f* / (1 + (K-1) rho), max_trade_notional_frac),
# then capped by max_gross_leverage and a joint stress test per dex.
leverage:
  mode: kelly
  kelly_fraction: 0.25
  # Prior ρ for the equicorrelation Kelly split; overridden each cycle by a
  # shrunk estimate from the signals panel (portfolio.fit_cross_pair_correlation).
  assumed_pair_correlation: 0.3
  rho_prior_strength: 20.0
  rho_feature: exp_return
  max_trade_notional_frac: 0.15
  max_gross_leverage: 1.5
  stress_quantile: 0.01
  stress_margin_buffer: 1.5
  default_stress_loss_frac: 0.05
  default_max_leverage: 3
  exchange_leverage: 3
  isolated_leverage: 2
  cycle_hours: 4
  # Assumed net funding carry on gross notional; refine from funding history.
  funding_bps_per_hour: 0.1
  calibration_prior_mean: 0.5
  calibration_prior_sd: 0.25
  # Strength of the population pull on per-pair calibration factors.
  pair_calibration_strength: 4.0
  min_leg_usd: 11.0
  dry_run_dex_split:
    '': 0.8
    xyz: 0.2
executor:
  mode: live
  private_key_env: HL_PRIVATE_KEY_MAINNET
  account_address_env: HL_ACCOUNT_ADDRESS_MAINNET
  # M8: set after `scripts/manage_subaccounts.py create --name pairs --execute`
  # and funding the subaccount. Until then the master account is used.
  subaccount_address_env: HL_PAIRS_SUBACCOUNT
  network: mainnet
  slippage_tolerance: 0.01
  prefer_maker: true
  maker_timeout_sec: 30
# Fixed account limits, independent of sizing. Review by hand when equity
# changes; they are not scaled automatically.
safeguards:
  max_notional_per_order: 500.0
  max_total_exposure_usd: 4650.0
  # Opening orders only; reduce-only closes don't count.
  max_daily_orders: 10
fees:
  # default_fee_pct and slippage_bps are the ONLY fee keys the code reads
  # (journal.compute_pnl and leverage.exit_policy_from_cfg). taker_fee_pct and
  # maker_fee_pct were removed: no source file read them, so editing them had no
  # effect on any computed PnL. Measured fill fees from the exchange, when
  # available, supersede default_fee_pct entirely; the slippage allowance is
  # kept either way, so the net figure stays conservative.
  default_fee_pct: 0.00045
  slippage_bps: 3
ou_prior:
  kappa_pop: 0.0115
  kappa_pop_sd: 0.004
