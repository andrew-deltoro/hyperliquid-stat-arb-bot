# Phase 3 LIVE config — mainnet execution with tiny safeguards
# Scale by editing the safeguards block only.

pairs:
  - ["ETH", "BTC"]
  - ["SOL", "AVAX"]
  - ["AAVE", "COMP"]

data:
  interval: "1h"
  lookback_hours: 720

model:
  coint_draws: 2000
  coint_tune: 2000
  ou_draws: 2000
  ou_tune: 2000
  chains: 4
  cores: 4

signal:
  z_entry_min: 1.5
  edge_min: 0.05
  max_btc_vol: 0.55    # skip entries above this annualized BTC vol

position:
  base_notional: 2700.0
  baseline_balance: 5000.0          # anchor for scale=1.0
  compounding_enabled: true
  scale_safeguards: true
  target_frac: 0.5
  exit_horizon_mult: 2.0
  stop_mult: 3.0
  beta_shift_max: 0.20


risk:
  max_concurrent_positions: 3
  max_total_notional: 500.0
  cluster_caps:
    btc_eth: 250.0
    alt_l1: 300.0
    defi: 300.0
    oracle: 200.0
    meme: 150.0

executor:
  mode: "live"
  private_key_env: "HL_PRIVATE_KEY_MAINNET"
  account_address_env: "HL_ACCOUNT_ADDRESS_MAINNET"
  network: "mainnet"
  slippage_tolerance: 0.01          # 1% tighter than testnet
  prefer_maker: true              # try post-only limit first
  maker_timeout_sec: 30           # wait this long before falling back to market


safeguards:
  max_notional_per_order: 25.0    # 5 per leg hard cap (tiny live trial)
  max_total_exposure_usd: 100.0  # 00 total (4 pairs × $25)
  max_daily_orders: 10

fees:
  taker_fee_pct: 0.00045
  maker_fee_pct: 0.00015
  default_fee_pct: 0.00045
  slippage_bps: 3

ou_prior:
  kappa_pop: 0.0115
  kappa_pop_sd: 0.0040
